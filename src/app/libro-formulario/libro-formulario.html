<div class="form-container">
<h2>{{ modo === 'crear' ? 'Nuevo Libro' : 'Editar Libro' }}</h2>
<form (ngSubmit)="guardar()">
<label>Título:</label>
<input type="text" [(ngModel)]="libro.titulo" name="titulo" required>

<label>Autor:</label>
<input type="text" [(ngModel)]="libro.autor" name="autor" required>

<label>Descripción:</label>
<textarea [(ngModel)]="libro.descripcion" name="descripcion"></textarea>

<button type="submit">{{ modo === 'crear' ? 'Crear' : 'Actualizar' }}</button>
</form>
</div>
